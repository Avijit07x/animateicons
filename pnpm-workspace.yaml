packages:
  - "npm"
  - "core"
  - "cli"
  - "mcp"
  - "vanilla"
  - "vue"
  - "angular"
  - "test-zone"
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: true
sharedWorkspaceLockfile: false
pmOnFail: ignore
overrides:
  picomatch@^4: 4.0.7
allowBuilds:
  esbuild: true
  "@parcel/watcher": false
  unrs-resolver: true
