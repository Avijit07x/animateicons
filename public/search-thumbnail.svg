<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<title>AnimateIcons: heart, bell, star and rocket icons, the bell ringing on hover</title>
<defs>
<pattern id="plus" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M24 19v10M19 24h10" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.5" fill="none"/></pattern>
<radialGradient id="plusFade" cx="600" cy="600" r="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
