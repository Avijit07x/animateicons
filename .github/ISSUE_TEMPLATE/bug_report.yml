name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: A minimal snippet or steps. Name the icon and the library (lucide or huge).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@animateicons/react 0.7.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: React version, framework or bundler, browser.
      placeholder: "React 19, Next.js 16, Chrome 130"
