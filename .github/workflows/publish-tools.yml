name: Publish CLI + MCP

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        required: true
        type: choice
        options:
          - "animateicons"
          - "@animateicons/mcp"
          - "both"
      tag:
        description: "npm dist-tag (latest, next, beta, ...)"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify core + CLI + MCP packages
        run: pnpm --filter @animateicons/core --filter animateicons --filter @animateicons/mcp run verify

      - name: Publish animateicons (CLI)
        if: ${{ inputs.package == 'animateicons' || inputs.package == 'both' }}
        working-directory: cli
        run: npm publish --provenance --access public --tag ${{ inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @animateicons/mcp
        if: ${{ inputs.package == '@animateicons/mcp' || inputs.package == 'both' }}
        working-directory: mcp
        run: npm publish --provenance --access public --tag ${{ inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
