name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Find unused files, exports and dependencies (knip)
        run: pnpm knip

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Build project (includes the type check)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify every package (types, tests, build and size budgets)
        run: pnpm verify:packages

      - name: Validate package exports and types (publint + attw)
        run: pnpm lint:packages
        env:
          npm_config_ignore_scripts: "true"

  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the test zone
        run: pnpm --filter @animateicons/test-zone exec playwright install --with-deps chromium

      - name: Compare every icon in every framework with React, frame by frame
        run: pnpm test:frames
