name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Find unused files, exports and dependencies (knip)
        run: pnpm knip

      - name: Test
        run: pnpm test

      - name: Build project (includes the type check)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Typecheck npm package
        run: pnpm --filter @animateicons/react typecheck

      - name: Build npm package
        run: pnpm --filter @animateicons/react build

      - name: Codegen integrity test
        run: pnpm --filter @animateicons/react test:codegen

      - name: Validate package exports and types (publint + attw)
        run: pnpm exec publint npm && pnpm exec attw --pack npm --profile node16
        env:
          npm_config_ignore_scripts: "true"

      - name: Smoke-test npm package against built dist
        run: pnpm --filter @animateicons/react test:smoke

      - name: Enforce npm bundle size budget
        run: pnpm --filter @animateicons/react size

      - name: Verify core + CLI + MCP packages
        run: pnpm run verify:packages
