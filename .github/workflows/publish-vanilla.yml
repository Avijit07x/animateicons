name: Publish @animateicons/vanilla

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest, next, beta, ...)"
        required: false
        default: "latest"
  push:
    tags:
      - "vanilla-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm (prepack runs the build, tests and size budget first)
        working-directory: vanilla
        run: pnpm publish --provenance --access public --no-git-checks --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
